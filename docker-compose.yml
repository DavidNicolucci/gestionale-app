services:                                    # Elenco dei container che compongono l'app

  sqlserver:                                 # Primo servizio: il database SQL Server
    image: mcr.microsoft.com/mssql/server:2022-latest  # Immagine ufficiale Microsoft, versione 2022
    container_name: gestionale-sqlserver     # Nome fisso del container
    environment:                             # Variabili d'ambiente passate al container
      ACCEPT_EULA: "Y"                       # licenza Microsoft
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"   # Password dell'utente
      MSSQL_PID: "Developer"                 # Edizione gratuita per sviluppo (no licenza a pagamento)
    ports:                                   # Mappatura porte host:container
      - "1433:1433"                          # La 1433 del tuo PC punta alla 1433 del container (porta standard SQL Server)
    volumes:                                 # Dischi persistenti
      - sqlserver-data:/var/opt/mssql        # Salva i dati del DB nel volume, così non si perdono al riavvio
    healthcheck:                             # Controllo per sapere se il DB è davvero pronto
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD}" -C -Q "SELECT 1" || exit 1
      # Esegue una query banale: se risponde, il DB è vivo; -C accetta il cert self-signed
      interval: 10s                          # Ripete il test ogni 10 secondi
      timeout: 5s                            # Se la query non risponde entro 5s, fallisce
      retries: 10                            # Dopo 10 fallimenti consecutivi il container è "unhealthy"
      start_period: 90s                      # Periodo di grazia all'avvio: i fallimenti nei primi 90s non contano nei retry

  sqlserver-init:                            # Secondo servizio: container temporaneo che lancia lo script SQL
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gestionale-sqlserver-init
    depends_on:                              # Definisce l'ordine di avvio
      sqlserver:
        condition: service_healthy           # NON parte finché sqlserver non è "healthy" (vedi healthcheck sopra)
    volumes:
      - ./docker/sqlserver/init:/init        # Monta la cartella locale degli script dentro il container in /init
    entrypoint: >                            # Comando da eseguire all'avvio (il > permette di scriverlo su più righe)
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "${DB_PASSWORD}" -C -i /init/01-schema.sql
    restart: "no"                            # Una volta finito lo script, NON si riavvia (è usa-e-getta)

  rabbitmq:                                  # Terzo servizio: il broker di messaggi per le code
    image: rabbitmq:3.13-management          # Versione "management" = include l'interfaccia web di gestione
    container_name: gestionale-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"    # Username per accedere a RabbitMQ
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"    # Password corrispondente
    ports:
      - "5672:5672"                          # Porta AMQP: quella che useranno Quarkus/i producer-consumer per i messaggi
      - "15672:15672"                        # Porta della UI web (la apri nel browser su localhost:15672)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq      # Persiste code e configurazioni tra i riavvii

  # ==========================================================
  # OBSERVABILITY - i tre servizi che raccolgono e mostrano i dati
  # ==========================================================
  # Nota valida per tutti e tre: il backend NON gira in Docker, gira sull'host con
  # quarkus:dev. Quindi il backend li raggiunge su localhost (le porte sono pubblicate
  # qui sotto), mentre loro raggiungono il backend su host.docker.internal.

  jaeger:                                    # Raccoglie e mostra le TRACE (tracing distribuito)
    image: jaegertracing/all-in-one:1.76.0   # "all-in-one" = collector + storage + UI in un container
    container_name: gestionale-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"         # Abilita la ricezione in formato OTLP, quello che parla Quarkus
    ports:
      - "16686:16686"                        # Interfaccia web: http://localhost:16686
      - "4317:4317"                          # OTLP su gRPC: e' qui che Quarkus manda gli span
      - "4318:4318"                          # OTLP su HTTP: alternativa al gRPC, comoda per curl e test
    # Storage in memoria (default): le trace si perdono al riavvio del container.
    # Va benissimo in sviluppo; in produzione servirebbe Elasticsearch o Cassandra.

  prometheus:                                # Raccoglie e conserva le METRICHE
    image: prom/prometheus:v2.55.1
    container_name: gestionale-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro  # :ro = sola lettura
      - prometheus-data:/prometheus          # Serie storiche: senza volume si azzerano a ogni riavvio
    ports:
      - "9090:9090"                          # Interfaccia web: http://localhost:9090
    extra_hosts:
      # Crea host.docker.internal dentro il container puntandolo all'host. Su Docker
      # Desktop (Windows/Mac) c'e' gia', su Linux no: senza questa riga Prometheus non
      # troverebbe il backend e il target risulterebbe DOWN.
      - "host.docker.internal:host-gateway"

  grafana:                                   # Disegna i grafici leggendo da Prometheus e Jaeger
    image: grafana/grafana:11.3.0
    container_name: gestionale-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Password di Grafana: se GRAFANA_PASSWORD non e' nel .env usa "admin".
      # Va bene solo in locale: Grafana e' esposto sulla 3000 senza HTTPS.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # La cartella di provisioning: Grafana la legge all'avvio e si configura da solo
      # (sorgenti dati + dashboard), senza doverle ricreare a mano nella UI.
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"                          # Interfaccia web: http://localhost:3000
    depends_on:                              # Solo ordine di avvio: Grafana parte comunque
      - prometheus                           # anche se Prometheus non risponde subito
      - jaeger

volumes:                                     # Dichiarazione dei volumi nominati usati sopra
  sqlserver-data:                            # Docker lo crea e gestisce automaticamente
  rabbitmq-data:
  prometheus-data:
  grafana-data: