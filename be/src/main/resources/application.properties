# Disabilita il database automatico (usiamo SQL Server via docker-compose)
quarkus.datasource.devservices.enabled=false

# Disabilita RabbitMQ automatico
quarkus.rabbitmq.devservices.enabled=false

# ---- Datasource SQL Server ----
quarkus.datasource.db-kind=mssql
# Utente, password e indirizzo sono scritti per profilo (%dev = quarkus:dev, %prod =
# applicazione avviata dal jar) e NON in una riga valida per tutti: il profilo di test
# deve restare senza, altrimenti Dev Services non puo' sostituire il database con un
# SQL Server usa-e-getta - un valore scritto qui vincerebbe sul suo (vedi la sezione
# TEST in fondo). La password viene dalla variabile d'ambiente DB_PASSWORD (valore nel
# file .env, ignorato da git).
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=${DB_PASSWORD}
%dev.quarkus.datasource.jdbc.url=jdbc:sqlserver://localhost:1433;databaseName=gestionale;encrypt=true;trustServerCertificate=true
%prod.quarkus.datasource.username=sa
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:sqlserver://localhost:1433;databaseName=gestionale;encrypt=true;trustServerCertificate=true

# ---- Hibernate ORM ----
# Lo schema lo gestisce lo script docker/sqlserver/init/01-schema.sql, quindi Hibernate non lo modifica.
quarkus.hibernate-orm.database.generation=none

# Stampa le query SQL nei log: utile in sviluppo, da tenere spento altrove.
# Il prefisso %dev vale solo per quarkus:dev: in produzione ogni query finirebbe
# nei log con dentro i valori dei parametri (nomi, codici fiscali, ore lavorate),
# e i file di log hanno regole di accesso diverse da quelle del database.
%dev.quarkus.hibernate-orm.log.sql=true

# ---- Sicurezza ----
# Basic auth DISABILITATA: l'autenticazione avviene solo via JWT nel cookie HttpOnly.
# Se fosse attiva, un header "Authorization: Basic" (anche cachato dal browser) avrebbe
# la precedenza sul JWT e il principal non sarebbe un token: /api/auth/me fallirebbe.
quarkus.http.auth.basic=false

# ---- HTTPS / TLS (solo sviluppo) ----
# Tutto questo blocco e' sotto %dev. Il certificato e' self-signed e il keystore
# non e' versionato: esiste sulla macchina di chi sviluppa e da nessun'altra
# parte. In produzione il TLS lo termina nginx davanti al backend, che dentro la
# rete privata resta in chiaro sulla 8080 - vedi be/Dockerfile.
#
# Senza il prefisso %dev il container non parte proprio: Quarkus verifica TUTTE
# le configurazioni TLS con nome all'avvio, anche quelle che nessuno usa, e
# senza il file muore con "Invalid P12 key store configuration".
#
# Certificato self-signed per sviluppo (keystore PKCS12 in src/main/resources).
# La password del keystore e' letta da KEYSTORE_PASSWORD (file .env, ignorato da git);
# in mancanza usa "changeit" come default, cosi' l'app parte comunque in locale.
#
# Il keystore sta in una configurazione TLS con nome ("https") e non in quella di
# default (quarkus.tls.key-store...). Quella di default la eredita chiunque non ne
# indichi un'altra, compresa la management interface sulla 9000: che si metterebbe
# a parlare HTTPS, e Prometheus, che la chiama in HTTP, riceverebbe solo un "EOF"
# (target DOWN, dashboard vuote, alert muti). Con il nome, il certificato lo usa
# solo il server dell'applicazione.
%dev.quarkus.tls.https.key-store.p12.path=server-keystore.p12
%dev.quarkus.tls.https.key-store.p12.password=${KEYSTORE_PASSWORD:changeit}
%dev.quarkus.http.tls-configuration-name=https
# Porta HTTPS (default 8443)
%dev.quarkus.http.ssl-port=8443
# Le richieste HTTP (porta 8080) vengono reindirizzate automaticamente su HTTPS
%dev.quarkus.http.insecure-requests=redirect

# ---- CORS ----
# Il frontend Angular gira su http://localhost:4200 e inoltra /api al backend tramite
# il proxy del dev server: il browser vede una chiamata same-origin, ma il proxy passa
# comunque l'header "Origin: http://localhost:4200". Senza origins dichiarate Quarkus
# ammette le sole richieste same-origin e risponde "403 CORS Rejected - Invalid origin"
# prima di arrivare al resource (per questo la chiamata non compare nei log).
# NB: il filtro CORS viene costruito una sola volta all'avvio del server HTTP, quindi
# una modifica a queste righe NON viene presa dal live reload: serve riavviare quarkus:dev.
# In produzione l'origine si sovrascrive con la variabile QUARKUS_HTTP_CORS_ORIGINS.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
# Il JWT viaggia nel cookie HttpOnly: senza credentials il browser non lo manderebbe
# su una richiesta cross-origin.
quarkus.http.cors.access-control-allow-credentials=true

# ==========================================================
# RABBITMQ - canali di messaggistica per l'import file
# ==========================================================

# --- Connessione al broker (deve combaciare con docker-compose.yml) ---
rabbitmq-host=localhost
rabbitmq-port=5672
rabbitmq-username=gestionale
# Password letta dalla variabile d'ambiente RABBITMQ_PASSWORD (valore nel file .env, ignorato da git)
rabbitmq-password=${RABBITMQ_PASSWORD}

# --- Canale in USCITA (Producer) ---
mp.messaging.outgoing.import-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.import-out.exchange.name=import.exchange
mp.messaging.outgoing.import-out.default-routing-key=import

# --- Canale in ENTRATA (Consumer) ---
mp.messaging.incoming.import-in.connector=smallrye-rabbitmq
mp.messaging.incoming.import-in.queue.name=import.queue
mp.messaging.incoming.import-in.exchange.name=import.exchange
mp.messaging.incoming.import-in.routing-keys=import
mp.messaging.incoming.import-in.auto-bind-dlq=true
mp.messaging.incoming.import-in.dead-letter-queue-name=import.queue.dlq
# auto-bind-dlq da solo NON crea l'exchange DLX ne' il binding verso la DLQ:
# serve dlx.declare=true, altrimenti i messaggi rigettati verrebbero scartati.
mp.messaging.incoming.import-in.dlx.declare=true
# In caso di eccezione, RIGETTA il messaggio (basic.reject) invece di fermare il connettore
# (default = "fail"): solo cosi' il messaggio viene dead-letterato verso import.queue.dlq.
#
# reject manda in DLQ al PRIMO fallimento. Per un file rovinato e' corretto - riprovare
# non serve - ma per un errore di circostanza (una connessione al database che cade per
# due secondi, un lock timeout) sarebbe severo. La riprova quindi non e' qui ma dentro
# ImportConsumer, per una ragione precisa: il broker sa solo che il messaggio e' fallito,
# il consumer sa PERCHE'. Si riprova solo cio' che e' riconosciuto come passeggero (vedi
# ErroriTransitori), e quando le riprove finiscono il messaggio viene rigettato come
# prima. Vedi import.riprove piu' sotto.
mp.messaging.incoming.import-in.failure-strategy=reject

# --- Canale della CODA DI SCARTO (DLQ) ---
# Fin qui in import.queue.dlq non leggeva nessuno: i messaggi si accumulavano e un
# import saltato di notte non bussava a nessuno. Adesso li legge ImportDlqConsumer, che
# non li rielabora ma segna il fallimento sulla tabella import_job. E' quel registro,
# non la coda, il posto da cui si guarda (GET /api/admin/import) e da cui si rilancia.
#
# La coda e l'exchange NON si dichiarano qui: li crea gia' il canale import-in con
# auto-bind-dlq + dlx.declare. Ridichiararli non servirebbe e, se un domani i parametri
# divergessero, RabbitMQ rifiuterebbe la dichiarazione e il canale non partirebbe.
# Il binding lo indichiamo solo per sapere cosa leggere: DLX e' il nome di default
# dell'exchange di scarto del connettore, e la routing key e' il nome della coda
# originale.
mp.messaging.incoming.import-dlq.connector=smallrye-rabbitmq
mp.messaging.incoming.import-dlq.queue.name=import.queue.dlq
mp.messaging.incoming.import-dlq.queue.declare=false
mp.messaging.incoming.import-dlq.exchange.name=DLX
mp.messaging.incoming.import-dlq.exchange.declare=false
mp.messaging.incoming.import-dlq.routing-keys=import.queue

# ---- Import file ----
import.upload-dir=./uploads
# cartella dove l'endpoint salva i file caricati, in attesa che il consumer li legga

# Quante righe stanno in una transazione. L'import non e' piu' un solo @Transactional
# sull'intero file: su un foglio da 5.000 righe quello teneva una connessione del pool
# occupata per minuti, e un errore alla riga 4.999 annullava anche le 4.998 buone.
# Il numero e' un compromesso: piu' alto = meno commit ma transazioni piu' lunghe e piu'
# lavoro perso quando un blocco salta; piu' basso = il contrario.
import.blocco-righe=500

# Tentativi su un blocco, il primo compreso. Valgono SOLO per gli errori passeggeri
# (connessione caduta, deadlock, lock timeout): un file rovinato o un vincolo violato
# non vengono riprovati nemmeno una volta, perche' riprovarli vuol dire solo aspettare
# tre volte per avere tre volte lo stesso errore. A 1 la riprova e' spenta.
import.riprove=3

# Attesa prima della prima riprova; raddoppia a ogni tentativo successivo (2s, 4s, 8s).
# Raddoppia invece di restare fissa perche' se il database sta ripartendo, tre tentativi
# ravvicinati lo trovano giu' tutte e tre le volte.
import.attesa-riprova=PT2S

# Diciamo a SmallRye di serializzare i messaggi in uscita come JSON
mp.messaging.outgoing.import-out.serializer=io.vertx.core.json.jackson.DatabindCodec

# ==========================================================
# AI - Google Gemini (via AI Studio)
# ==========================================================
quarkus.langchain4j.ai.gemini.api-key=${GEMINI_API_KEY}
# La chiave NON è qui: viene letta dalla variabile d'ambiente GEMINI_API_KEY

quarkus.langchain4j.ai.gemini.chat-model.model-id=gemini-2.5-flash
# Il modello da usare (verifichiamo il nome esatto al prossimo passo)

# Mostra nei log le richieste/risposte verso Gemini: in sviluppo e' il modo per
# capire perche' ha risposto male (si vede la conversazione completa, quali strumenti
# sceglie e cosa gli torna indietro). Solo in dev, pero': acceso in produzione
# scriverebbe nei log ogni domanda di ogni utente e ogni risposta, con dentro i dati
# del gestionale. Stessa ragione di %dev.quarkus.hibernate-orm.log.sql qui sopra.
%dev.quarkus.langchain4j.ai.gemini.log-requests=true
%dev.quarkus.langchain4j.ai.gemini.log-responses=true

# ---- Tetto alle domande ----
# Quante domande puo' fare un utente all'assistente. Ogni domanda e' una chiamata a
# Gemini che si paga a token: senza queste due righe l'unico limite era @Size(max=2000)
# sul testo della singola domanda, che non impedisce a nessuno di farne mille di fila.
# Le finestre sono scorrevoli (l'ultima ora, l'ultime 24 ore), non l'ora di orologio.
# Il conto e' per username, preso dal token; a 0 il limite e' spento.
chat.limite.ora=30
chat.limite.giorno=200

# Quanti messaggi della conversazione vengono rimandati a Gemini a ogni domanda.
# E' il contesto del modello, non lo storico mostrato all'utente: quello sta per
# intero sulla tabella chat_messaggio. Qui si tiene corto perche' ogni messaggio
# in finestra viene ri-inviato (e ripagato) a ogni richiesta.
quarkus.langchain4j.chat-memory.memory-window.max-messages=40

# ==========================================================
# OBSERVABILITY
# ==========================================================
# Nome e versione finiscono nei tag delle metriche e nell'attributo service.name
# delle trace: senza, in Grafana e Jaeger l'applicazione comparirebbe come "unknown".
quarkus.application.name=gestionale-backend
quarkus.application.version=1.0.0-SNAPSHOT

# ---- Management interface (porta separata, HTTP in chiaro) ----
# health e metrics NON stanno sulla porta dell'applicazione ma su una loro porta.
# Il motivo e' concreto: sulla 8080 vale quarkus.http.insecure-requests=redirect e
# sulla 8443 c'e' un certificato self-signed, quindi Prometheus dovrebbe seguire un
# redirect e poi ignorare la validazione del certificato. La management interface
# risolve entrambe le cose e in piu' non e' un endpoint pubblico dell'API: in
# produzione la si espone solo alla rete di monitoraggio, non a internet.
quarkus.management.enabled=true
quarkus.management.port=9000
quarkus.management.root-path=/q

# ---- Health checks ----
# /q/health/live  -> "il processo e' vivo?" (se risponde NO, si riavvia il container)
# /q/health/ready -> "posso mandargli traffico?" (database e broker raggiungibili)
# /q/health       -> l'unione dei due
# I check su datasource e RabbitMQ li registra Quarkus da solo con le estensioni gia'
# presenti; qui aggiungiamo solo quelli che sa fare unicamente il nostro codice.
quarkus.datasource.health.enabled=true
quarkus.rabbitmq.health.enabled=true
# UI dei check, comoda in sviluppo: http://localhost:9000/q/health-ui
quarkus.smallrye-health.ui.always-include=false


# ---- Metriche (Micrometer -> Prometheus) ----
# http://localhost:9000/q/metrics
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
# Binder = raccoglitore automatico di un certo gruppo di metriche.
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.http-client.enabled=true

# Le risposte dei dipendenti contengono lo stato (ATTIVO / IN_SCADENZA / SCADUTO), che
# dipende da che giorno e' oggi. Una risposta tenuta in cache senza scadenza resterebbe
# ferma a com'era quando l'abbiamo calcolata: un contratto finito stanotte continuerebbe
# a risultare attivo finche' qualcuno non modifica qualcosa. Dieci minuti e' il ritardo
# massimo che accettiamo fra la scadenza reale e quella mostrata.
quarkus.cache.caffeine."dipendenti-lista".expire-after-write=10M
quarkus.cache.caffeine."dipendente-singolo".expire-after-write=10M

# Le metriche vanno accese cache per cache, col nome ESATTO usato in @CacheResult
# (le costanti CACHE_LISTA e CACHE_SINGOLO in DipendenteService). Un nome che non
# combacia non da' nessun errore: configura una cache che non esiste, e quelle vere
# restano senza metriche. E' quello che succedeva fin qui.
#
# Da queste due righe escono cache_gets_total{cache="...", result="hit"|"miss"} su
# /q/metrics, cioe' la risposta alla domanda che conta: la cache serve davvero?
# Una cache con poche hit e' pura perdita - occupa memoria e introduce il rischio di
# dati vecchi senza risparmiare niente - e senza queste metriche non si puo' sapere.
#
#   sum(rate(cache_gets_total{result="hit"}[5m])) / sum(rate(cache_gets_total[5m]))
#
# NB: nessun maximum-size configurato, quindi vale il default (nessun limite).
# Per dipendenti-lista e' irrilevante, e' una voce sola. Per dipendente-singolo la
# cache cresce quanto il numero di dipendenti aperti in dieci minuti: qui non e' un
# problema, ma e' un default da conoscere prima che l'anagrafica diventi grande.
quarkus.cache.caffeine."dipendenti-lista".metrics-enabled=true
quarkus.cache.caffeine."dipendente-singolo".metrics-enabled=true
# Metriche del pool di connessioni Agroal (connessioni attive, in attesa, esaurite)
quarkus.datasource.metrics.enabled=true
quarkus.datasource.jdbc.enable-metrics=true

# ---- Tracing distribuito (OpenTelemetry -> Jaeger) ----
# Jaeger gira in docker-compose e accetta OTLP su gRPC 4317.
quarkus.otel.enabled=true
quarkus.otel.traces.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=http://localhost:4317
# Campiona il 100% delle richieste: giusto in sviluppo, in produzione si abbassa
# (es. 0.1 = 10%) perche' ogni span costa banda e spazio sul collector.
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=1.0
# Le chiamate a /q/* (health, metrics) non generano span: sono rumore, arrivano
# ogni 15 secondi da Prometheus e sommergerebbero le trace vere.
quarkus.otel.traces.suppress-non-application-uris=true
# Aggiunge gli span delle query SQL dentro la trace della richiesta REST:
# e' cosi' che si vede quale query sta rallentando un endpoint.
quarkus.datasource.jdbc.telemetry=true
# Metriche e log via OTLP restano spenti: le metriche le fa Micrometer (sopra) e i
# log li leggiamo dalla console. Accenderli qui vorrebbe dire raccoglierli due volte.
quarkus.otel.metrics.enabled=false
quarkus.otel.logs.enabled=false

# ---- Log ----
# traceId e spanId sono messi nell'MDC da OpenTelemetry a ogni richiesta: portandoli
# nel log si passa da una riga di log alla trace completa (e viceversa).
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) traceId=%X{traceId} spanId=%X{spanId} %s%e%n
# Il JSON serve a chi raccoglie i log (Loki, ELK...), non a noi che leggiamo la
# console: in dev e nei test lo teniamo spento, altrimenti l'output e' illeggibile.
quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# ==========================================================
# TEST (@QuarkusTest)
# ==========================================================
# I test che avviano l'applicazione non devono dipendere dal docker-compose gia'
# acceso ne' scrivere sul database di sviluppo: qui il datasource viene sostituito
# da un SQL Server usa-e-getta (Dev Services + Testcontainers), lo schema lo genera
# Hibernate dalle entity e i dati li mette src/test/resources/import.sql.
# Funziona perche' url, utente e password del datasource sono scritti solo per i
# profili %dev e %prod (vedi in cima al file): qui non c'e' nessun jdbc.url, e senza
# jdbc.url Dev Services fa il suo mestiere.
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.hibernate-orm.database.generation=drop-and-create
# RabbitMQ resta spento anche nei test (lo e' gia' in cima al file). I canali di
# messaggistica provano a collegarsi e non ci riescono - nel log si vede qualche
# "Connection refused" - ma l'applicazione parte lo stesso e gli endpoint rispondono.
# Va bene finche' i test non toccano l'import: il giorno che servira' provare anche
# quel percorso, qui andra' acceso un broker usa-e-getta (il Dev Services di RabbitMQ
# su questa macchina non ce la fa: il container impiega piu' del minuto di attesa
# previsto da Testcontainers e il test fallisce prima che sia pronto).
# Chiave finta: nei test non si chiama Gemini (costerebbe), ma senza un valore la
# configurazione non si risolve e l'applicazione non parte.
%test.quarkus.langchain4j.ai.gemini.api-key=chiave-finta-nei-test

# ---- JWT ----
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://gestionale.local/issuer
quarkus.smallrye-jwt.enabled=true
# Il token viene letto dal cookie HttpOnly "gestionale_jwt" invece che dall'header
# Authorization: JavaScript non puo' leggerlo, quindi un attacco XSS non puo' rubarlo.
# Il nome deve combaciare con COOKIE_NAME in AuthResource.
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=gestionale_jwt

# ---- Durata della sessione (vedi EmissioneToken e FiltroSessione) ----
# La sessione e' "scorrevole": il cookie viene riemesso a ogni richiesta, quindi
# l'utente non viene buttato fuori mentre sta lavorando. Con una scadenza fissa dal
# login, chi entrava alle 9 si ritrovava sloggato alle 17, magari con un form
# compilato a meta'.
#
# inattivita': quanto dura il token emesso adesso, cioe' dopo quanto tempo senza
# chiamate la sessione muore. E' anche la finestra in cui vale una copia rubata del
# token, e per questo e' corta: allungarla non serve, visto che si rinnova da sola.
sessione.inattivita=30M
# durata-massima: il tetto dal momento in cui l'utente ha digitato la password. Senza,
# una scheda lasciata aperta a fare chiamate terrebbe viva la sessione per sempre. E'
# largo di proposito, per cadere fuori dall'orario di lavoro e non in mezzo.
# A 0 il tetto non c'e' e conta solo l'inattivita'.
sessione.durata-massima=12H
# rinnovo-minimo: ogni quanto rifirmare davvero il token. Firmare costa qualche
# millisecondo di RSA e una pagina che fa venti chiamate insieme lo pagherebbe venti
# volte per spostare la scadenza di un istante.
sessione.rinnovo-minimo=1M
# cache-stato: per quanto tenere in memoria "questo utente e' attivo e la sua epoca e'
# N", invece di rileggerlo dal database a ogni richiesta. La revoca resta comunque
# immediata, perche' chi la esegue svuota anche la cache; questo tempo e' il ritardo
# che avrebbero le ALTRE istanze, se un giorno il backend girasse su piu' macchine.
sessione.cache-stato=30S

# ---- Protezione del login dai tentativi a raffica (vedi ProtezioneLogin) ----
# Superata la soglia la chiave si blocca per blocco-iniziale; ogni fallimento in piu'
# raddoppia l'attesa, fino a blocco-massimo. "memoria" e' dopo quanto tempo senza
# fallimenti la chiave torna pulita. Un login riuscito azzera subito lo username.
login.protezione.username.max-fallimenti=5
login.protezione.username.memoria=24H
# Soglia piu' alta e memoria piu' corta: dietro un solo IP puo' esserci un ufficio
# intero, e gli errori di battitura di tutti si sommano.
login.protezione.ip.max-fallimenti=20
login.protezione.ip.memoria=1H
login.protezione.blocco-iniziale=1M
login.protezione.blocco-massimo=1H
# Il limite per IP funziona solo se l'IP e' quello vero. In produzione, dietro un
# reverse proxy, vanno attivate le righe sotto (con l'indirizzo del proxy): senza,
# tutti gli utenti avrebbero l'IP del proxy e ne basterebbero 20 per chiudere fuori
# tutti. Senza trusted-proxies, invece, chiunque potrebbe mandare un X-Forwarded-For
# inventato e cambiare IP a ogni tentativo.
#quarkus.http.proxy.proxy-address-forwarding=true
#quarkus.http.proxy.allow-x-forwarded=true
#quarkus.http.proxy.trusted-proxies=10.0.0.5