<a
  class="dashboard-card"
  [style.--card-accent]="card().colore"
  [routerLink]="['/', card().route]"
>
  <span class="icon-tile">
    <mat-icon>{{ card().icona }}</mat-icon>
  </span>

  <span class="text">
    <span class="titolo">{{ card().titolo }}</span>
    <span class="descrizione">{{ card().descrizione }}</span>
  </span>

  <mat-icon class="chevron">chevron_right</mat-icon>
</a>
