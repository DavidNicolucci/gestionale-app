<div class="page mb-8">
  <app-go-back class="indietro" [to]="AppRoute.HOME" />

  <h1>Siti</h1>

  <!-- Il pulsante non è un filtro: sta fuori dalla search bar, spinto a destra. -->
  <div class="barra">
    <app-siti-search-bar
      class="ricerca"
      [filtri]="query.filtri()"
      [opzioniNome]="query.opzioniNome()"
      [clienti]="query.clienti()"
      (filtriChange)="onFiltri($event)"
      (applica)="onApplica()"
      (rimuovi)="onRimuovi()"
    />

    <button class="nuovo" mat-flat-button type="button" (click)="onNuovoSito()">
      <mat-icon>add</mat-icon>
      Nuovo sito
    </button>
  </div>

  @if (query.errorMessage()) {
    <p class="errore">{{ query.errorMessage() }}</p>
  }

  <!-- La tabella c'è sempre: all'arrivo mostra tutti i siti, e "Applica filtri"
       la restringe. Mentre si digita cambia solo la tendina, non le righe. -->
  <app-siti-tabella
    class="tabella"
    [siti]="query.sitiTabella()"
    [loading]="query.loadingTabella()"
    [totaleElementi]="query.totaleElementi()"
    [numeroDiPagina]="query.numeroDiPagina()"
    [righePerPagina]="query.righePerPagina()"
    (paginaChange)="onPagina($event)"
    (elimina)="onElimina($event)"
  />
</div>

<!-- Spinner unico della pagina: vale sia per la ricerca della tendina sia per
     quella della tabella. Non intercetta i click, così si può continuare a scrivere. -->
@if (query.inCaricamento()) {
  <div class="caricamento">
    <mat-spinner diameter="40" />
  </div>
}
