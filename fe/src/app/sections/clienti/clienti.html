<div class="page mb-8">
  <button class="indietro" mat-button type="button" (click)="onIndietro()">
    <mat-icon>arrow_back</mat-icon>
    Indietro
  </button>

  <h1 class="mb -5">Clienti</h1>

  <app-clienti-search-bar
    [filtri]="filtri()"
    [opzioniRagioneSociale]="opzioniRagioneSociale()"
    [opzioniPartitaIva]="opzioniPartitaIva()"
    (filtriChange)="onFiltri($event)"
    (applica)="onApplica()"
    (rimuovi)="onRimuovi()"
  />

  @if (errorMessage()) {
    <p class="errore">{{ errorMessage() }}</p>
  }

  <!-- Mentre si digita i risultati stanno solo nelle tendine: la tabella
       compare al click su "Applica filtri". -->
  @if (tabellaVisibile()) {
    <app-clienti-tabella
      class="tabella"
      [clienti]="clientiTabella()"
      [loading]="loadingTabella()"
    />
  }
</div>

<!-- Spinner unico della pagina: vale sia per la ricerca delle tendine sia per
     quella della tabella. Non intercetta i click, così si può continuare a scrivere. -->
@if (inCaricamento()) {
  <div class="caricamento">
    <mat-spinner diameter="40" />
  </div>
}
