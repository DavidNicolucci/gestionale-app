<div class="page mb-8">
  <button class="indietro" mat-button type="button" (click)="onIndietro()">
    <mat-icon>arrow_back</mat-icon>
    Indietro
  </button>

  <h1 class="mb -5">Clienti</h1>

  <app-clienti-search-bar
    [filtri]="filtri()"
    [opzioniRagioneSociale]="opzioniRagioneSociale()"
    [opzioniPartitaIva]="opzioniPartitaIva()"
    [loading]="loading()"
    (filtriChange)="onFiltri($event)"
  />

  @if (errorMessage()) {
    <p class="errore">{{ errorMessage() }}</p>
  }

  <!-- I clienti trovati per ora si vedono solo nelle tendine dei campi di ricerca. -->
</div>
