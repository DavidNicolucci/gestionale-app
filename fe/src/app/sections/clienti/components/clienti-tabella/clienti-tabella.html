@if (clienti().length) {
  <div class="riquadro">
    <!-- Sotto una certa larghezza la tabella scorre da sola: comprimendo le colonne
         gli indirizzi andrebbero a capo e le righe perderebbero l'allineamento. -->
    <div class="scorrevole">
      <table mat-table [dataSource]="clienti()" [trackBy]="tracciaCliente" class="tabella">
        <ng-container matColumnDef="ragioneSociale">
          <th mat-header-cell *matHeaderCellDef>Ragione sociale</th>
          <td mat-cell *matCellDef="let cliente">{{ cliente.ragioneSociale }}</td>
        </ng-container>

        <ng-container matColumnDef="partitaIva">
          <th mat-header-cell *matHeaderCellDef>Partita IVA</th>
          <td mat-cell *matCellDef="let cliente">{{ cliente.partitaIva }}</td>
        </ng-container>

        <ng-container matColumnDef="indirizzo">
          <th mat-header-cell *matHeaderCellDef>Indirizzo</th>
          <td mat-cell *matCellDef="let cliente">{{ cliente.indirizzo }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="colonne"></tr>
        <tr mat-row *matRowDef="let riga; columns: colonne"></tr>
      </table>
    </div>

    <!-- length è il totale trovato dai filtri, non le righe a schermo: è quello che
         permette al paginatore di sapere quante pagine esistono. -->
    <mat-paginator
      class="paginatore"
      [length]="totaleElementi()"
      [pageIndex]="numeroDiPagina()"
      [pageSize]="righePerPagina()"
      [pageSizeOptions]="opzioniRighePerPagina"
      (page)="onPagina($event)"
    />
  </div>
} @else if (!loading()) {
  <!-- Durante la ricerca la tabella è ancora vuota: non è un "nessun risultato". -->
  <div class="vuoto">
    <mat-icon class="icona" aria-hidden="true">search_off</mat-icon>
    <p class="titolo">Nessun cliente trovato</p>
    <p class="messaggio">Prova a cambiare i filtri di ricerca.</p>
  </div>
}
